[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issuesense"
dynamic = ["version"]
description = "Evidence-grounded engineering intelligence across organizational sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]
agent = [
  "langgraph>=0.2,<1.0",
]
persistence = [
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
]
observability = [
  "langsmith>=0.3,<1.0",
]

[project.scripts]
issuesense-api = "apps.api.main:run"

[tool.hatch.version]
path = "packages/common/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "tests"]
plugins = ["pydantic.mypy"]
